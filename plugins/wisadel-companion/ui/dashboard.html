<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>维什戴尔 · 键鼠计数</title>
<style>
:root{color-scheme:light dark;font-family:"Noto Serif SC",Georgia,serif;background:light-dark(#f6f4ef,#202126);color:light-dark(#26262a,#eee)}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:720px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0 0 6px}p{color:light-dark(#68676b,#babac2);font-size:13px;line-height:1.6;margin:0}.status{font-size:12px;padding:5px 9px;border:1px solid #8886;border-radius:5px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0 16px}.card{padding:18px;background:light-dark(#fff,#2b2c33);border:1px solid #8883;border-radius:8px}.number{display:block;font-family:"Baskerville Old Face","Noto Serif SC",serif;font-size:36px;font-variant-numeric:tabular-nums;line-height:1.5}.label{font-size:13px;color:light-dark(#626169,#bfc0c8)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #8883;font-size:14px}.row b{font-variant-numeric:tabular-nums;font-weight:500;font-family:"Baskerville Old Face","Noto Serif SC",serif}#cost .money-main{font-size:18px}#cost .money-decimal{font-size:11px;opacity:.78}#tokens{white-space:nowrap}.controls{margin:18px 0;display:flex;flex-wrap:wrap;gap:10px}button,select{font:inherit;font-size:13px;border:1px solid #8886;border-radius:5px;background:light-dark(#fff,#32333b);color:inherit;padding:8px 12px;cursor:pointer}button:hover{border-color:#de616d}button:focus-visible,select:focus-visible{outline:2px solid #de616d;outline-offset:2px}button:disabled{opacity:.5;cursor:default}#notice{min-height:40px}footer{margin-top:16px;font-size:11px;color:light-dark(#777,#aaa)}@media(max-width:360px){body{padding:14px}.number{font-size:28px}}
</style>
<header><div><h1>维什戴尔 · 键鼠计数</h1><p>悬停维维时显示，离开后隐藏，次数持续累计。</p></div><span id="state" class="status">连接中</span></header>
<section class="cards"><div class="card"><span class="label">累计 · 键盘</span><strong id="keys" class="number">—</strong></div><div class="card"><span class="label">累计 · 鼠标</span><strong id="mouse" class="number">—</strong></div></section>
<div class="row"><span>累计键盘 / 鼠标</span><b id="total">—</b></div><div class="row"><span>鼠标左 / 右 / 中 / 侧键</span><b id="detail">—</b></div>
<div class="row"><span>今日 Token</span><b id="tokens">—</b></div><div class="row"><span>今日 $ · API 折算</span><b id="cost">—</b></div><p id="usage-note"></p><div class="controls"><button id="pause" disabled>暂停统计</button><button id="overlay" disabled>隐藏悬停计数</button><button id="start" disabled>启用自动启动</button><button id="refresh">刷新</button></div>
<p id="notice" role="status">正在连接本地统计服务。</p><footer>所有键均计数 · 长按只计一次 · 只保存次数，不记录输入内容</footer>
<script>
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('zh-CN');
function compactTokens(n){if(!Number.isFinite(Number(n))||Number(n)<0)return '—';n=Math.floor(Number(n));if(n>=10000){const wan=Math.floor(n/10000)+(n%10000>=5000?1:0),yi=Math.floor(wan/10000),rest=wan%10000;return yi?yi+'亿'+(rest?rest+'万':''):wan+'万'}return fmt(n)}
function showCost(value){const node=$('cost'),number=Number(value);if(!Number.isFinite(number)){node.textContent='—';return}const parts=number.toFixed(4).split('.');node.innerHTML='<span class=money-main>$'+parts[0]+'</span><span class=money-decimal>.'+parts[1]+'</span>'}let current=null,ready=false,nextId=0;const pending=new Map();
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++nextId;const timeout=setTimeout(()=>{pending.delete(id);reject(Error('插件连接超时，请刷新或在新任务中重新打开面板。'))},7000);pending.set(id,{resolve,reject,timeout});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.timeout);pending.delete(m.id);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}else if(m.method==='ui/notifications/tool-result')show(m.params)});
function show(result){const d=result?.structuredContent;if(!d)return;current=d;$('tokens').textContent=d.usage?.ready&&d.usage.daily_tokens!=null?compactTokens(d.usage.daily_tokens):'—';showCost(d.usage?.ready?d.usage.daily_usd_estimate:null);$('usage-note').textContent=d.usage?.ready?'codex-auto-review 按 GPT-5.6 Terra 估值；未定价 Token '+fmt(d.usage.daily_unpriced_tokens)+'；待核实历史段 '+fmt(d.usage.pending_files):'正在同步历史用量。';$('keys').textContent=fmt(d.total.Keyboard);$('mouse').textContent=fmt(d.total.Mouse);$('total').textContent=fmt(d.total.Keyboard)+' / '+fmt(d.total.Mouse);$('detail').textContent=['Left','Right','Middle','Side'].map(k=>fmt(d.total[k])).join(' / ');$('state').textContent=!d.runtime.running?'服务未运行':d.settings.paused?'已暂停':'统计中';$('pause').textContent=d.settings.paused?'继续统计':'暂停统计';$('overlay').textContent=d.settings.overlay_enabled?'隐藏悬停计数':'启用悬停计数';$('start').textContent=d.settings.autostart?'关闭自动启动':'启用自动启动';document.querySelectorAll('button,select').forEach(x=>x.disabled=false);$('notice').textContent=!d.runtime.running?'服务尚未运行，点击启用自动启动；若仍无响应，请检查助手状态。':d.runtime.save_error?'统计保存失败，请检查数据目录权限。':!d.runtime.pet_found?'正在寻找维什戴尔，请显示 Codex 原生宠物。':d.runtime.badge_visible?'计数面板正在维维旁边显示。':'已连接维维，鼠标移到她身上即可显示计数。';parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:document.body.scrollHeight}},'*')}
async function call(name,args={}){if(window.openai?.callTool)return window.openai.callTool(name,args);if(!ready)throw Error('请在 Codex 插件界面中打开此面板。');return rpc('tools/call',{name,arguments:args})}
async function refresh(){try{show(await call('get_stats'))}catch(e){$('notice').textContent=e.message}}
async function change(p){try{const r=await call('set_preferences',p);if(r.isError)throw Error(r.content?.[0]?.text||'设置失败');show(r)}catch(e){$('notice').textContent=e.message}}
$('pause').onclick=()=>change({paused:!current.settings.paused});$('overlay').onclick=()=>change({overlay_enabled:!current.settings.overlay_enabled});$('start').onclick=()=>change({autostart:!current.settings.autostart});$('refresh').onclick=refresh;
(async()=>{if(window.openai?.toolOutput)show({structuredContent:window.openai.toolOutput});if(window.openai?.callTool){ready=true;await refresh();return}if(parent===window){$('notice').textContent='这是插件面板文件，请通过 Codex 的“显示维什戴尔统计面板”打开。';return}try{await rpc('ui/initialize',{appInfo:{name:'wisadel-companion',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'});ready=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');await refresh()}catch(e){$('notice').textContent=e.message}})();
setInterval(()=>{if(ready&&!document.hidden)refresh()},2000);
</script></html>
